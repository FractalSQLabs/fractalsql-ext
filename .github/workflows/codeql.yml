name: CodeQL

# The extension is C (a plain make, no DuckDB source), and the MCP server under mcp/ is C++. CodeQL's source-only
# analysis (build-mode: none) covers both without wiring a build into the analysis -- it still catches the bulk of
# interesting issues (tainted inputs, buffer overflows on literal arrays, iterator invalidation).

on:
  push:
    branches: [main, '2.x']
  pull_request:
    branches: [main, '2.x']
  schedule:
    - cron: '43 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, actions]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
